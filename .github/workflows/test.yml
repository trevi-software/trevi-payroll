name: tests

on:
  pull_request:
    branches:
      - "18.0*"
  push:
    branches:
      - "18.0"
      - "18.0-ocabot-*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unreleased-deps:
    runs-on: ubuntu-latest
    name: Detect unreleased dependencies
    steps:
      - uses: actions/checkout@v4
      - run: |
          for reqfile in requirements.txt test-requirements.txt ; do
              if [ -f ${reqfile} ] ; then
                  result=0
                  # reject non-comment lines that contain a / (i.e. URLs, relative paths)
                  grep "^[^#].*/" ${reqfile} || result=$?
                  if [ $result -eq 0 ] ; then
                      echo "Unreleased dependencies found in ${reqfile}."
                      exit 1
                  fi
              fi
          done
  test:
    runs-on: ubuntu-22.04
    container: ${{ matrix.container }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: ghcr.io/oca/oca-ci/py3.10-odoo18.0:latest
            name: test with Odoo
          - container: ghcr.io/oca/oca-ci/py3.10-ocb18.0:latest
            name: test with OCB
            makepot: "true"
    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
    env:
      # Cross-repo addon dependencies, see the step below and issue #16.
      TREVI_HR_REPO: trevi-software/trevi-hr
      TREVI_HR_REF: "18.0"
      # Build the addons at their plain manifest version. Without this, whool
      # derives a post-release segment from the git history, which actions/checkout
      # does not fetch (it clones with depth 1).
      WHOOL_POST_VERSION_STRATEGY_OVERRIDE: none
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Most addons in this repo depend on addons that live in
      # trevi-software/trevi-hr. oca_install_addons turns every out-of-repo addon
      # dependency into an `odoo-addon-<name>==18.0.*` requirement and installs it
      # from the OCA wheelhouse, where these addons do not exist.
      # Declaring them here as direct URL requirements takes priority:
      # oca_list_addons_to_test_as_url_reqs skips addons that already have a URL
      # requirement, and oca_install_addons appends its own computed requirements
      # to this same file and installs the lot in one resolution pass.
      #
      # This is the full transitive closure, not just the direct dependencies:
      # hr_contract_values, trevi_hr_job_categories and trevi_hr_usability are not
      # depended on from this repo, but hr_contract_status pulls them in, and
      # nothing else would resolve them.
      #
      # This has to be a workflow step rather than a committed test-requirements.txt
      # because the `Detect unreleased dependencies` job rejects URL lines there.
      #
      # Mirrors trevi-software/trevi-hr#123. See
      # https://github.com/trevi-software/trevi-payroll/issues/16
      - name: Declare trevi-hr dependencies as git requirements
        run: |
          for addon in \
              base_lock \
              hr_accrual_bank \
              hr_attendance_day \
              hr_contract_status \
              hr_contract_values \
              hr_contract_values_payroll \
              hr_employee_seniority_months \
              hr_employee_status \
              hr_leave_type_unique \
              resource_schedule \
              trevi_hr_job_categories \
              trevi_hr_usability \
          ; do
            echo "odoo-addon-${addon} @ git+https://github.com/${TREVI_HR_REPO}@${TREVI_HR_REF}#subdirectory=${addon}"
          done >> test-requirements.txt
          cat test-requirements.txt
      - name: Install addons and dependencies
        run: oca_install_addons
      - name: Check licenses
        run: manifestoo -d . check-licenses
      - name: Check development status
        run: manifestoo -d . check-dev-status --default-dev-status=Beta
      - name: Initialize test db
        run: oca_init_test_database
      - name: Run tests
        run: oca_run_tests
      - name: Upload screenshots from JS tests
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: Screenshots of failed JS tests - ${{ matrix.name }}${{ join(matrix.include) }}
          path: /tmp/odoo_tests/${{ env.PGDATABASE }}
          if-no-files-found: ignore
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Update .pot files
        run: oca_export_and_push_pot https://x-access-token:${{ secrets.GIT_PUSH_TOKEN }}@github.com/${{ github.repository }}
        if: ${{ matrix.makepot == 'true' && github.event_name == 'push' && github.repository_owner == 'trevi-software' }}
